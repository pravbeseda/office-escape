<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080d">
  <title>Побег из опенспейса</title>
  <script>
    // Browsers refuse a manifest over file://, so it is linked only when the page is served.
    if (location.protocol !== 'file:') document.head.append(Object.assign(document.createElement('link'), { rel: 'manifest', href: 'manifest.json' }));
  </script>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #07080d; }
    body {
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #pause {
      display: none; position: fixed; top: 12px; right: 12px; width: 48px; height: 48px; padding: 0;
      font: 14px "Press Start 2P", monospace; color: #ffd84a; background: #20308a;
      border: 3px solid #ffffff; box-shadow: 0 0 0 2px #1a1220;
    }
    #stick {
      position: fixed; left: 0; top: 0; width: 80px; height: 80px; margin: -40px 0 0 -40px;
      box-sizing: border-box; border: 3px solid rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: none;
    }
    #stick > div {
      position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.45);
    }
    @media (pointer: coarse) {
      #pause { display: block; }
    }
    /* Portrait phones: the picture sits on top, the free space below is for the thumb. */
    @media (pointer: coarse) and (orientation: portrait) {
      body { flex-direction: column; justify-content: flex-start; }
      #pause { position: static; align-self: flex-end; margin: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="240"></canvas>
  <button id="pause" type="button" data-action="pause" aria-label="Пауза">II</button>
  <div id="stick" hidden><div></div></div>
  <script src="js/rng.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/sight.js"></script>
  <script src="js/floorplan.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/tileart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
